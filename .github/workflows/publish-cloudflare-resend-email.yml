name: Publish Cloudflare Resend Email Article

on:
  push:
    branches: [main]
    paths:
      - scripts/publish-cloudflare-resend-custom-domain-email.mjs
      - .github/workflows/publish-cloudflare-resend-email.yml

permissions:
  contents: read

jobs:
  publish:
    if: "github.event.head_commit.message == 'content: publish Cloudflare and Resend email article'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Publish article to MicroCMS
        run: bun scripts/publish-cloudflare-resend-custom-domain-email.mjs
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
